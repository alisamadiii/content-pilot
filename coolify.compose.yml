services:
  content-pilot:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - SERVICE_FQDN_CONTENTPILOT_3010
      - DATABASE_URL=postgres://postgres:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/content_pilot
      - BETTER_AUTH_SECRET=${SERVICE_BASE64_64_AUTHSECRET}
      # Hardcoded: Coolify's SERVICE_FQDN_* magic var does not interpolate here
      # (service name has a dash → slug mismatch), leaving better-auth with an
      # unresolved origin. The bare SERVICE_FQDN line above still drives routing.
      - BETTER_AUTH_URL=https://pilot.alisamadii.com
      - GITHUB_APP_ID=${GITHUB_APP_ID}
      - GITHUB_APP_PRIVATE_KEY=${GITHUB_APP_PRIVATE_KEY}
      - WORKSPACE_DIR=/data/workspace
      - POLL_INTERVAL_MS=300000
      - JOB_TIMEOUT_MS=600000
      - CLAUDE_MODEL=haiku
      - GIT_AUTHOR_NAME=AI Edit Bot
      - GIT_AUTHOR_EMAIL=ai-edits@alisamadii.com
    volumes:
      - cp-workspace:/data/workspace
      - cp-claude:/home/nextjs/.claude
    # This service runs TWO listeners: the Next admin app on :3010 and the
    # preview reverse-proxy on :3020 (src/preview/proxy.ts). Coolify's generated
    # router for pilot.alisamadii.com has no explicit service/port — it relies on
    # Traefik auto-detecting the container's single port. Defining ANY explicit
    # Traefik service below makes that detected port the container default, which
    # would silently bind the admin domain to the wrong listener. So we define
    # BOTH routers explicitly here:
    #  - pilot.alisamadii.com      -> cp-web (:3010), LE cert, high priority so it
    #    wins over Coolify's now-ambiguous auto-router.
    #  - *.alisamadii.dev (wildcard) -> cp-preview (:3020). Coolify's Domains field
    #    and SERVICE_FQDN magic vars reject wildcards, so it's raw Traefik labels.
    #    TLS terminates at Cloudflare; http covers Flexible, https covers Full.
    # Traefik v3.6 HostRegexp uses Go-regexp syntax.
    labels:
      - traefik.enable=true
      - 'traefik.http.routers.cp-web-http.rule=Host(`pilot.alisamadii.com`)'
      - traefik.http.routers.cp-web-http.entryPoints=http
      - traefik.http.routers.cp-web-http.middlewares=redirect-to-https
      - traefik.http.routers.cp-web-http.priority=1000
      - 'traefik.http.routers.cp-web-https.rule=Host(`pilot.alisamadii.com`)'
      - traefik.http.routers.cp-web-https.entryPoints=https
      - traefik.http.routers.cp-web-https.tls=true
      - traefik.http.routers.cp-web-https.tls.certresolver=letsencrypt
      - traefik.http.routers.cp-web-https.service=cp-web
      - traefik.http.routers.cp-web-https.priority=1000
      - traefik.http.services.cp-web.loadbalancer.server.port=3010
      - 'traefik.http.routers.cp-preview-http.rule=HostRegexp(`^[a-z0-9-]+\.alisamadii\.dev$`)'
      - traefik.http.routers.cp-preview-http.entryPoints=http
      - traefik.http.routers.cp-preview-http.service=cp-preview
      - 'traefik.http.routers.cp-preview-https.rule=HostRegexp(`^[a-z0-9-]+\.alisamadii\.dev$`)'
      - traefik.http.routers.cp-preview-https.entryPoints=https
      - traefik.http.routers.cp-preview-https.tls=true
      - traefik.http.routers.cp-preview-https.service=cp-preview
      - traefik.http.services.cp-preview.loadbalancer.server.port=3020
      # Custom domains (uploaded projects): Cloudflare for SaaS proxies the
      # customer's hostname to the fallback origin with the ORIGINAL Host
      # header, so these catch-alls hand any unrecognized host to the preview
      # proxy, which resolves host -> repoId from its domain map or 404s.
      # Priority 1 loses to every explicit router above and to other Coolify
      # apps. The https router serves Traefik's default cert, so the zone's
      # SSL mode must be Full (not Full strict) for custom hostnames.
      - 'traefik.http.routers.cp-domains-http.rule=HostRegexp(`^.+$`)'
      - traefik.http.routers.cp-domains-http.entryPoints=http
      - traefik.http.routers.cp-domains-http.priority=1
      - traefik.http.routers.cp-domains-http.service=cp-preview
      - 'traefik.http.routers.cp-domains-https.rule=HostRegexp(`^.+$`)'
      - traefik.http.routers.cp-domains-https.entryPoints=https
      - traefik.http.routers.cp-domains-https.tls=true
      - traefik.http.routers.cp-domains-https.priority=1
      - traefik.http.routers.cp-domains-https.service=cp-preview
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3010/api/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - POSTGRES_DB=content_pilot
    volumes:
      - cp-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10
